<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>إمبراطورية السيارات</title><style> *{box-sizing:border-box;user-select:none}body{margin:0;background:#080c14;color:#f1f5f9;font-family:system-ui,sans-serif}#app{min-height:100vh;padding-bottom:70px} .hdr{position:sticky;top:0;z-index:20;background:#0f172a;border-bottom:1px solid #1e293b;padding:10px 12px}.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px} .bdg{background:#1e293b;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800}.gld{color:#fbbf24}.grn{color:#34d399}.cyn{color:#22d3ee}.ros{color:#fb7185} .grd{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;padding:10px}.crd{background:#131c31;border:1px solid #26334d;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px} .stg{background:radial-gradient(ellipse at bottom,#1e293b,#090d16);border-radius:10px;height:125px;position:relative;display:flex;align-items:center;justify-content:center} .btn{border:none;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.b-g{background:#f59e0b;color:#090d16}.b-e{background:#10b981;color:#090d16}.b-c{background:#164e63;color:#22d3ee}.b-d{background:#1e293b;color:#e2e8f0} .nav{position:fixed;bottom:0;inset-x:0;background:#0f172a;border-top:1px solid #1e293b;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px} .nt{background:none;color:#94a3b8;border:none;border-radius:8px;padding:5px 2px;font-size:11px;font-weight:800;cursor:pointer}.nt.on{background:#f59e0b;color:#090d16} .mdl{position:fixed;inset:0;z-index:40;background:rgba(2,6,23,.85);display:flex;align-items:center;justify-content:center;padding:12px}.mbx{background:#111827;border:1px solid #334155;border-radius:16px;max-width:440px;width:100%;padding:14px} .inp{background:#090d16;border:1px solid #334155;color:#fff;border-radius:8px;padding:8px;font-size:14px;font-weight:800;width:100%} </style></head><body><div id="app" dir="rtl"></div><script> const C=[{i:'c1',n:'Honda Civic Type-R',p:5000,h:170},{i:'c2',n:'VW Golf GTI Turbo',p:9500,h:245},{i:'c3',n:'BMW M3 E46 Comp',p:15000,h:340},{i:'c4',n:'Mercedes C63 AMG V8',p:21000,h:460},{i:'c5',n:'Dodge Charger Hellcat',p:29000,h:560},{i:'c6',n:'Ford Mustang GT500',p:35000,h:600},{i:'c7',n:'Nissan Silvia S15',p:38000,h:330},{i:'c8',n:'Toyota Supra MK4 2JZ',p:56000,h:450},{i:'c9',n:'Nissan GT-R R35 Nismo',p:82000,h:610},{i:'c10',n:'Porsche 911 GT3 RS',p:150000,h:530},{i:'c11',n:'Lamborghini Huracan STO',p:220000,h:640},{i:'c12',n:'Bugatti Chiron Sport',p:480000,h:1500}]; const P=[{k:'e',n:'المحرك والبساتم',w:.3},{k:'g',n:'الجيربوكس والكلتش',w:.25},{k:'b',n:'الهيكل والشاصي',w:.2},{k:'s',n:'نظام التعليق',w:.15},{k:'r',n:'المكابح السيراميك',w:.1}]; const T=[{k:'u',n:'برمجة ECU Stage',c:.08,h:40},{k:'t',n:'تيربو مزدوج Twin-Turbo',c:.14,h:80},{k:'x',n:'عادم تيتانيوم Exhaust',c:.07,h:30},{k:'f',n:'بساتم فورجد Forged',c:.12,h:60},{k:'n',n:'غاز النيتروز NOS',c:.1,h:70}]; const CL=['#ef4444','#3b82f6','#10b981','#eab308','#f97316','#a855f7','#06b6d4','#f8fafc']; const B=[{n:'الكابتن سامي',a:'🧔🏻‍♂️',m:.88},{n:'إيلينا فينتشر',a:'👩🏼‍💼',m:.91},{n:'ماركو السريع',a:'🕶️',m:.80},{n:'طارق دريفت',a:'🏎️',m:.86}]; let S=JSON.parse(localStorage.getItem('ae1')||'null')||{c:25000,d:1,s:0,pf:0,w:0,sl:3,g:[],m:[],l:[],i:0,tb:'m',ws:'r',xr:0,ng:null,slm:null}; function sv(){try{localStorage.setItem('ae1',JSON.stringify(S))}catch(e){}} function $(n){return(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US')} function st(c){const m=C.find(x=>x.i===c.m)||C[0];let d=0;P.forEach(p=>d+=(c.d[p.k]||0)*p.w);d=Math.round(d);let bh=0,tv=0;T.forEach(u=>{const l=c.t[u.k]||0;bh+=l*u.h;tv+=l*m.p*u.c*1.4});const hp=Math.round((m.h+bh)*(1-d*.003));const v=Math.round((m.p*Math.max(.3,1-d*.008)+tv+(c.sp?1200:0))*(c.wn?1.12:1));return{m,d,hp,v,iv:(c.pd||0)+(c.ir||0)};} function gm(){S.m=[];const pl=C.filter((x,i)=>i<4||x.p<=S.c*1.7);for(let i=0;i<6;i++){const m=pl[Math.floor(Math.random()*pl.length)],b=B[i%4],d={};P.forEach(p=>d[p.k]=Math.floor(Math.random()*45));const c={id:'m'+Date.now()+i,m:m.i,cl:CL[i%8],d,t:{},sp:i%2===0,b,sc:0};const k=st(c);c.ak=Math.round(k.v*(.92+Math.random()*.18)/50)*50;c.mn=Math.round(c.ak*b.m/50)*50;S.m.push(c)}sv()} if(!S.m.length)gm(); function svg(c,xr){return`<svg viewBox="0 0 280 115" style="width:100%;height:115px"><ellipse cx="140" cy="104" rx="112" ry="6" fill="#06b6d4" opacity=".45"/>${c.sp?'<path d="M24 64L12 42L22 42L30 64Z" fill="#f59e0b"/>':''}<path d="M18 92L24 64L58 58L92 34L186 34L224 60L264 68L266 92Z" fill="${c.cl}" opacity="${xr?.3:1}" stroke="#fff"/><path d="M96 56L122 38L182 38L214 56Z" fill="#090d16"/>${xr?'<rect x="175" y="58" width="38" height="22" fill="#0f172a" stroke="#10b981" stroke-width="2"/><line x1="70" y1="88" x2="175" y2="75" stroke="#f59e0b" stroke-width="3"/>':''}<circle cx="70" cy="92" r="19" fill="#0f172a" stroke="#e2e8f0" stroke-width="3"/><circle cx="70" cy="92" r="8" fill="#fbbf24"/><circle cx="214" cy="92" r="19" fill="#0f172a" stroke="#e2e8f0" stroke-width="3"/><circle cx="214" cy="92" r="8" fill="#fbbf24"/></svg>`} function buy(id,pr){const x=S.m.findIndex(z=>z.id===id);if(x<0)return;const c=S.m[x],cs=pr||c.ak;if(S.g.length>=S.sl)return alert('الكراج ممتلئ!');if(S.c<cs)return alert('رصيدك غير كافٍ!');S.c-=cs;S.g.push(Object.assign({},c,{id:'g'+Date.now(),pd:cs,ir:0}));S.i=S.g.length-1;S.m.splice(x,1);S.ng=null;if(S.m.length<3)gm();sv();rn()} function rn(){ let h=''; if(S.tb==='m'){h=`<div class="row" style="padding:10px"><strong style="font-size:15px">🏪 سوق السيارات (عروض البوتات)</strong><button class="btn b-g" onclick="S.d++;gm();rn()">🔄 تحديث (Day ${S.d})</button></div><div class="grd">`+S.m.map(c=>{const k=st(c);return`<div class="crd"><div class="row"><span>${c.b.a} ${c.b.n}</span><span class="bdg gld">${k.hp} HP</span></div><div class="stg">${svg(c,0)}<span class="bdg ros" style="position:absolute;top:6px;left:6px">ضرر ${k.d}%</span></div><strong>${k.m.n}</strong><div style="font-size:12px;color:#94a3b8">القيمة: ${c.sc?$(k.v):'🔍 افحص OBD'}</div><div class="row"><strong class="grn" style="font-size:16px">${$(c.ak)}</strong><div style="display:flex;gap:5px"><button class="btn b-c" onclick="S.ng={id:'${c.id}',o:Math.round(c.ak*.9),m:'أطلب '+$(c.ak)};rn()">💬 تفاوض</button><button class="btn b-e" onclick="buy('${c.id}',${c.ak})">⚡ شراء</button></div></div></div>`}).join('')+`</div>`} else if(S.tb==='g'){h=!S.g.length?`<div style="padding:40px;text-align:center"><h3>كراجك فارغ حالياً</h3><button class="btn b-g" onclick="S.tb='m';rn()">الذهاب للسوق</button></div>`:`<div class="grd">`+S.g.map((c,i)=>{const k=st(c),pf=k.v-k.iv;return`<div class="crd"><div class="stg">${svg(c,0)}<span class="bdg gld" style="position:absolute;top:6px;right:6px">${k.hp} HP</span><span class="bdg ${k.d?'ros':'grn'}" style="position:absolute;top:6px;left:6px">ضرر ${k.d}%</span></div><strong>${k.m.n}</strong><div style="font-size:12px">التكلفة: ${$(k.iv)} | القيمة: ${$(k.v)} (${pf>=0?'+':''}${$(pf)})</div><div class="row"><button class="btn b-c" onclick="S.i=${i};S.tb='w';rn()">🔧 الورشة</button><button class="btn b-e" onclick="S.slm={i:${i},a:${Math.round(k.v*1.08)}};rn()">💰 بيع للبوتات</button></div></div>`}).join('')+`</div>`} else if(S.tb==='w'){const c=S.g[S.i]||S.g[0];if(!c)h=`<div style="padding:40px;text-align:center"><h3>اشترِ سيارة أولاً لتعديلها</h3></div>`;else{const k=st(c);h=`<div style="padding:10px"><div class="crd"><div class="row"><strong>${k.m.n} (${k.hp} HP | القيمة: ${$(k.v)})</strong><button class="btn b-c" onclick="S.xr=!S.xr;rn()">🔬 X-Ray</button></div><div class="stg">${svg(c,S.xr)}</div><div class="row"><button class="btn ${S.ws==='r'?'b-g':'b-d'}" onclick="S.ws='r';rn()">🛠️ الإصلاح</button><button class="btn ${S.ws==='t'?'b-g':'b-d'}" onclick="S.ws='t';rn()">⚡ التزويد HP</button><button class="btn ${S.ws==='p'?'b-g':'b-d'}" onclick="S.ws='p';rn()">🎨 الطلاء</button></div>`+(S.ws==='r'?P.map(p=>{const d=c.d[p.k]||0,rc=Math.max(40,Math.round(k.m.p*p.w*(d/100)*.5));return`<div class="row" style="background:#090d16;padding:8px;border-radius:8px"><span>${p.n} (ضرر ${d}%)</span><button class="btn ${d?'b-e':'b-d'}" ${d?'':'disabled'} onclick="if(S.c>=${rc}){S.c-=${rc};c.ir+=${rc};c.d['${p.k}']=0;sv();rn()}">${d?'إصلاح '+$(rc):'✓ 100%'}</button></div>`}).join(''):S.ws==='t'?T.map(u=>{const l=c.t[u.k]||0,tc=Math.round(k.m.p*u.c*(1+l*.3));return`<div class="row" style="background:#090d16;padding:8px;border-radius:8px"><span>${u.n} (Lv.${l}/3 • +${u.h}HP)</span><button class="btn ${l<3?'b-g':'b-d'}" ${l<3?'':'disabled'} onclick="if(S.c>=${tc}){S.c-=${tc};c.ir+=${tc};c.t['${u.k}']=(c.t['${u.k}']||0)+1;sv();rn()}">${l<3?'تزويد '+$(tc):'MAX ✓'}</button></div>`}).join(''):`<div class="row">`+CL.map(cl=>`<button class="btn" style="background:${cl};width:34px;height:30px" onclick="if(S.c>=350){S.c-=350;c.cl='${cl}';c.ir+=350;sv();rn()}"></button>`).join('')+`<button class="btn b-c" onclick="if(S.c>=600){S.c-=600;c.sp=!c.sp;c.ir+=600;sv();rn()}">جناح GT ($600)</button></div>`)+`</div></div>`}} else if(S.tb==='d'){const c=S.g[S.i]||S.g[0];if(!c)h=`<div style="padding:40px;text-align:center"><h3>اشترِ سيارة أولاً للسباق</h3></div>`;else{const k=st(c),pz=Math.round(700+k.hp*3);h=`<div style="padding:10px"><div class="crd"><h3>🏁 حلبة سباق الداينو - ${k.m.n} (${k.hp} HP)</h3><div class="stg">${svg(c,0)}</div><button class="btn b-g" onclick="if(Math.random()<.75){S.c+=${pz};S.w++;c.wn=1;alert('🏆 فزت بالسباق! ربحت '+$(${pz})+' وزادت قيمة سيارتك +12%!');}else alert('الخصم سبقك! ارفع الأحصنة في الورشة.');sv();rn()">🚦 انطلاق سباق 1/4 ميل (جائزة ${$(pz)})</button></div></div>`}} else{h=`<div style="padding:10px"><div class="crd"><h3>🏛️ الإمبراطورية وسجل الصفقات</h3><div class="row"><span class="bdg grn">المبيعات: ${S.s}</span><span class="bdg gld">الأرباح: ${$(S.pf)}</span><span class="bdg cyn">انتصارات: ${S.w}</span></div><button class="btn b-g" onclick="if(S.c>=4500){S.c-=4500;S.sl+=2;sv();rn()}">🏗️ توسعة الكراج (+2) بـ $4,500 (السعة: ${S.sl})</button>${S.l.slice(0,6).map(l=>`<div class="row" style="font-size:12px;padding:5px 0;border-bottom:1px solid #1e293b"><span>${l.n}</span><span class="${l.p>=0?'grn':'ros'}">${$(l.s)} (${l.p>=0?'+':''}${$(l.p)})</span></div>`).join('')}</div></div>`} let m=''; if(S.ng){const c=S.m.find(x=>x.id===S.ng.id);if(c){const k=st(c);m=`<div class="mdl"><div class="mbx"><div class="row"><strong>${c.b.a} ${c.b.n}</strong><button class="btn b-d" onclick="S.ng=null;rn()">✕</button></div><p style="font-size:13px">${S.ng.m} | القيمة: ${c.sc?$(k.v):'???'}</p><button class="btn b-c" style="margin-bottom:8px" onclick="if(!c.sc&&S.c>=150){S.c-=150;c.sc=1;sv();rn()}">🔍 فحص كمبيوتر OBD ($150)</button><input id="bo" type="number" class="inp" value="${S.ng.o}"><div class="row" style="margin-top:8px"><button class="btn b-g" onclick="const v=Number(document.getElementById('bo').value);if(v>=c.mn)buy('${c.id}',v);else{c.ak=Math.round((c.ak+c.mn)/2);S.ng.m='سأخفض السعر إلى '+$(c.ak);rn()}">💬 تقديم العرض</button><button class="btn b-e" onclick="buy('${c.id}',c.ak)">⚡ شراء فوري</button></div></div></div>`}} if(S.slm){const c=S.g[S.slm.i];if(c){const k=st(c);m=`<div class="mdl"><div class="mbx"><div class="row"><strong>💰 بيع ${k.m.n}</strong><button class="btn b-d" onclick="S.slm=null;rn()">✕</button></div><p style="font-size:12px">التكلفة: ${$(k.iv)} | القيمة: ${$(k.v)}</p><input type="number" class="inp" value="${S.slm.a}" oninput="S.slm.a=Number(this.value)"><div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">`+B.slice(0,3).map((b,i)=>{const o=Math.round(Math.min(S.slm.a,k.v*(.95+i*.08))/50)*50,pf=o-k.iv;return`<div class="row" style="background:#090d16;padding:8px;border-radius:8px"><span>${b.a} ${b.n}: ${$(o)} (${pf>=0?'+':''}${$(pf)})</span><button class="btn b-e" onclick="S.c+=${o};S.s++;S.pf+=${pf};S.l.unshift({n:'${k.m.n}',s:${o},p:${pf}});S.g.splice(${S.slm.i},1);S.slm=null;sv();rn()">✓ بيع</button></div>`}).join('')+`</div></div></div>`}} document.getElementById('app').innerHTML=`<header class="hdr"><div class="row"><strong>🏎️ إمبراطورية السيارات</strong><div style="display:flex;gap:6px"><span class="bdg grn">${$(S.c)}</span><span class="bdg gld">الكراج ${S.g.length}/${S.sl}</span></div></div></header>${h}${m}<nav class="nav"><button class="nt ${S.tb==='m'?'on':''}" onclick="S.tb='m';rn()">🏪 السوق</button><button class="nt ${S.tb==='g'?'on':''}" onclick="S.tb='g';rn()">🚘 كراجي</button><button class="nt ${S.tb==='w'?'on':''}" onclick="S.tb='w';rn()">🔧 الورشة</button><button class="nt ${S.tb==='d'?'on':''}" onclick="S.tb='d';rn()">🏁 الداينو</button><button class="nt ${S.tb==='e'?'on':''}" onclick="S.tb='e';rn()">🏛️ الإمبراطورية</button></nav>`; } rn(); </script></body></html>
